<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ことだま占い{% endblock %}</title>
  <meta name="description" content="{% block description %}AIとリアルデータが紡ぐ、今日のあなたへの言霊占い{% endblock %}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block ogp %}
  <meta property="og:title" content="{{ og_title | default('ことだま占い') }}">
  <meta property="og:description" content="{{ og_description | default('AIとリアルデータが紡ぐ、今日のあなたへの言霊占い') }}">
  <meta property="og:image" content="{{ og_image_url | default('https://kotodama-fortune.onrender.com/static/ogp.png') }}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ og_title | default('ことだま占い') }}">
  <meta name="twitter:description" content="{{ og_description | default('AIとリアルデータが紡ぐ、今日のあなたへの言霊占い') }}">
  <meta name="twitter:image" content="{{ og_image_url | default('https://kotodama-fortune.onrender.com/static/ogp.png') }}">
  {% endblock %}
  {% block jsonld %}
  <!-- JSON-LD 構造化データ (WebSite) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "ことだま占い",
    "url": "https://kotodama-fortune.onrender.com",
    "description": "名前の言霊と今日のリアルデータをもとにAIが生成する、毎日変わるオリジナル占い",
    "inLanguage": "ja",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://kotodama-fortune.onrender.com/name/{search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  {% endblock %}
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XMQ7M4M5J1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XMQ7M4M5J1');
  </script>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1165244338225367"
    crossorigin="anonymous"></script>
</head>

<body>
  {% block content %}{% endblock %}

  <!-- Cookie banner -->
  <div class="cookie-banner" id="cookieBanner" style="display:none">
    <span>このサイトはGoogle AdSenseのCookieを使用します。
      <a href="{{ url_for('privacy') }}" style="color:#b06090">詳細</a>
    </span>
    <button onclick="acceptCookies()">同意する</button>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
